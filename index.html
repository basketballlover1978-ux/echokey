<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EchoKey 12 - Full Nav</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; background: #050505; color: #a3e0ff;
            font-family: 'Segoe UI', Roboto, sans-serif; 
            overflow: hidden; display: flex; flex-direction: column; height: 100vh;
        }
        #stats {
            height: 15vh; display: flex; justify-content: center;
            align-items: center; background: #000; position: relative;
            font-size: 1.8rem; font-weight: 300; border-bottom: 1px solid #111;
        }
        #label-text { color: #555; }
        #dots { color: #555; margin: 0 10px; }
        #lvl-text { color: #fff; font-weight: 400; min-width: 50px; text-align: left; }
        
      #exit-btn {
  position: absolute; 
  left: 30px; 
  padding: 8px 15px;
  font-size: 0.8rem; 
  color: #fff; 
  border: 1px solid #a3e0ff; 
  background: transparent; 
  cursor: pointer; 
  letter-spacing: 2px;
  text-transform: uppercase; 
  border-radius: 3px; 
  transition: 0.3s;
  display: none; 
  z-index: 200;
}
        #exit-btn:hover { color: #ff5252; border-color: #ff5252; }

        #vol-ctrl { position: absolute; right: 40px; display: flex; align-items: center; gap: 12px; }
        #vol-slider { appearance: none; width: 120px; height: 4px; background: #222; border-radius: 2px; }
        #vol-slider::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; background: #a3e0ff; border-radius: 50%; cursor: pointer; }
        
        #stage { flex: 1; perspective: 1500px; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at 50% 50%, #111 0%, #000 100%); position: relative; }
        #piano-container { width: 90%; height: 50%; transform: rotateX(22deg); transform-style: preserve-3d; transition: transform 0.1s; }
        #piano-body { display: flex; width: 100%; height: 100%; background: #0d0d0d; border: 5px solid #1a1a1a; border-radius: 4px; box-shadow: 0 40px 100px rgba(0,0,0,0.9); position: relative; }
        
        .key { flex: 1; height: 100%; cursor: pointer; background: linear-gradient(to bottom, #eee 0%, #fff 85%, #bbb 100%); border: 1px solid #999; border-radius: 0 0 5px 5px; transition: 0.1s; -webkit-tap-highlight-color: transparent; }
        .active-correct { background: #4fc3f7 !important; transform: translateZ(-25px); box-shadow: 0 0 40px rgba(79, 195, 247, 0.4); }
        .active-wrong { background: #ff5252 !important; transform: translateZ(-25px); }
        .black-key { position: absolute; top: 0; width: 4.8%; height: 56%; background: linear-gradient(to bottom, #222, #000); z-index: 10; border-radius: 0 0 3px 3px; cursor: pointer; border: 1px solid #000; }
        
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 150; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .menu-btn { width: 280px; padding: 18px 0; font-size: 1rem; color: #a3e0ff; background: rgba(163, 224, 255, 0.05); border: 1px solid rgba(163, 224, 255, 0.3); cursor: pointer; letter-spacing: 4px; margin: 10px; text-transform: uppercase; border-radius: 4px; transition: 0.3s; }
        .menu-btn:hover { background: rgba(163, 224, 255, 0.15); border-color: #a3e0ff; }
        
        #exit-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; justify-content: center; align-items: center; color: #444; letter-spacing: 5px; text-transform: uppercase; }
        
        .score-val { font-size: 2.2rem; color: #fff; font-weight: 300; margin-bottom: 5px; }
        .best-val { font-size: 1.8rem; color: #888; font-weight: 300; }
        .score-label { color: #444; text-transform: uppercase; letter-spacing: 3px; font-size: 0.7rem; margin-top: 15px; }
        details[open] .when-closed { display: none; }
details:not([open]) .when-open { display: none; }
    </style>
</head>
<body onclick="initAudio()">
<div id="instruction-banner" style="background: #111; color: #eee; font-family: sans-serif; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; padding: 10px 15px;">
    <div id="instruction-content" style="font-size: 0.9rem; flex-grow: 1; color: #aaa;">
       <span style="color: #fff; margin-right: 8px;">?</span> <strong>HOW TO PLAY:</strong> Watch the echo, then play it back!
    </div>
    <button id="toggle-instructions" onclick="toggleUIInstructions()" style="background: rgba(255,255,255,0.05); border: 1px solid #444; color: #fff; cursor: pointer; padding: 4px 12px; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;">
        Hide
    </button>
</div>

<div id="exit-screen">Session Terminated</div>

<div id="stats">
    <button id="exit-btn" onclick="showMainMenu()">Exit</button>
    <div id="hud-content" style="display:none;">
        <span id="label-text">Level</span><span id="dots">:</span> <span id="lvl-text"></span>
    </div>
  <div id="vol-ctrl">
      <span style="font-size: 0.75rem; color: #bbb; letter-spacing: 2px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">VOLUME</span>
      <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.7">
    </div>
  </div>

<div id="stage">
    <div id="start-menu" class="modal">
        <h1 style="letter-spacing: 18px; font-weight: 200; color: #fff; margin-bottom: 50px;">ECHOKEY</h1>
        <button class="menu-btn" onclick="startGame()">Challenge</button>
        <button class="menu-btn" onclick="freePlay()">Solo Session</button>
        <button class="menu-btn" style="color:#666; border-color:#333; margin-top:30px;" onclick="terminate()">Quit Game</button>
    </div>

    <div id="end-menu" class="modal" style="display:none;">
        <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:40px;">
            <span class="score-label">Round Score</span>
            <span id="res" class="score-val">0</span>
            <span class="score-label">Personal Best</span>
            <span id="top" class="best-val">0</span>
        </div>
        <button class="menu-btn" onclick="startGame()">Retry</button>
        <button class="menu-btn" onclick="showMainMenu()">Main Menu</button>
    </div>

    <div id="piano-container">
        <div id="piano-body">
            <div class="key" id="k0" onmousedown="hit(0)"></div><div class="key" id="k1" onmousedown="hit(1)"></div>
            <div class="key" id="k2" onmousedown="hit(2)"></div><div class="key" id="k3" onmousedown="hit(3)"></div>
            <div class="key" id="k4" onmousedown="hit(4)"></div><div class="key" id="k5" onmousedown="hit(5)"></div>
            <div class="key" id="k6" onmousedown="hit(6)"></div><div class="key" id="k7" onmousedown="hit(7)"></div>
            <div class="key" id="k8" onmousedown="hit(8)"></div><div class="key" id="k9" onmousedown="hit(9)"></div>
            <div class="key" id="k10" onmousedown="hit(10)"></div><div class="key" id="k11" onmousedown="hit(11)"></div>
            <div class="black-key" id="s0" style="left: 6.2%;" onmousedown="hit('s0')"></div>
            <div class="black-key" id="s1" style="left: 14.5%;" onmousedown="hit('s1')"></div>
            <div class="black-key" id="s2" style="left: 31.2%;" onmousedown="hit('s2')"></div>
            <div class="black-key" id="s3" style="left: 39.5%;" onmousedown="hit('s3')"></div>
            <div class="black-key" id="s4" style="left: 47.8%;" onmousedown="hit('s4')"></div>
            <div class="black-key" id="s5" style="left: 64.5%;" onmousedown="hit('s5')"></div>
            <div class="black-key" id="s6" style="left: 72.8%;" onmousedown="hit('s6')"></div>
            <div class="black-key" id="s7" style="left: 89.5%;" onmousedown="hit('s7')"></div>
        </div>
    </div>
</div>

<script>
    const freqs = [196, 220, 246.94, 261.63, 293.66, 329.63, 349.23, 392, 440, 493.88, 523.25, 587.33];
    const sharpFreqs = {'s0':207.65,'s1':233.08,'s2':277.18,'s3':311.13,'s4':369.99,'s5':415.30,'s6':466.16,'s7':554.37};
    let seq = [], user = [], best = localStorage.getItem('echoKeyBest') || 0, busy = false, mode = 'menu', audio;
    const volInput = document.getElementById('vol-slider');

    async function initAudio() {
        if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        if(audio.state === 'suspended') await audio.resume();
    }

    function playKeyboard(f, isError = false) {
        if(!audio) return;
        const globalVol = parseFloat(volInput.value) * 0.5; 
        if(isError) {
            const o = audio.createOscillator(); const g = audio.createGain();
            o.type = 'square'; o.frequency.setValueAtTime(110, audio.currentTime);
            g.gain.setValueAtTime(globalVol * 0.3, audio.currentTime);
            g.gain.linearRampToValueAtTime(0, audio.currentTime + 0.4);
            o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.4); return;
        }
        [1, 2, 3, 4].forEach((h, i) => {
            const osc = audio.createOscillator(); const gainNode = audio.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(f * h, audio.currentTime);
            gainNode.gain.setValueAtTime(0, audio.currentTime);
            gainNode.gain.linearRampToValueAtTime([0.6, 0.2, 0.1, 0.05][i] * globalVol, audio.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 1.2);
            osc.connect(gainNode); gainNode.connect(audio.destination); osc.start(); osc.stop(audio.currentTime + 1.2);
        });
    }

    function showMainMenu() {
        mode = 'menu';
        document.getElementById('start-menu').style.display = 'flex';
        document.getElementById('end-menu').style.display = 'none';
        document.getElementById('hud-content').style.display = 'none';
        document.getElementById('exit-btn').style.display = 'none';
    }

    function terminate() {
        document.getElementById('exit-screen').style.display = 'flex';
    }

    async function freePlay() {
        await initAudio(); mode = 'free';
        document.getElementById('start-menu').style.display = 'none';
        document.getElementById('hud-content').style.display = 'flex';
        document.getElementById('exit-btn').style.display = 'block';
        document.getElementById('label-text').innerText = "Solo Session";
        document.getElementById('dots').style.display = 'none';
        document.getElementById('lvl-text').style.display = 'none';
    }

    async function startGame() {
        await initAudio(); mode = 'game';
        document.getElementById('start-menu').style.display = 'none';
        document.getElementById('end-menu').style.display = 'none';
        document.getElementById('hud-content').style.display = 'flex';
        document.getElementById('exit-btn').style.display = 'block';
        document.getElementById('label-text').innerText = "Level";
        document.getElementById('dots').style.display = 'inline';
        document.getElementById('lvl-text').style.display = 'inline';
        seq = []; next();
    }

    async function next() {
        if(mode !== 'game') return;
        seq.push(Math.floor(Math.random()*12));
        user = [];
        document.getElementById('lvl-text').innerText = seq.length;
        busy = true;
        for(let i of seq) { 
            if(mode !== 'game') break;
            await new Promise(r => setTimeout(r, 700)); 
            anim(i); 
        }
        busy = false;
    }

    function anim(i, err=false) {
        const id = (typeof i === 'string') ? i : 'k'+i;
        const el = document.getElementById(id);
        if(!el) return;
        const c = err ? 'active-wrong' : 'active-correct';
        el.classList.add(c); 
        const f = (typeof i === 'string') ? sharpFreqs[i] : freqs[i];
        playKeyboard(f, err);
        setTimeout(() => el.classList.remove(c), 400);
    }

    async function hit(i) {
        await initAudio();
        if(mode === 'free') { anim(i, false); return; }
        if(typeof i === 'string' && i.startsWith('s')) return;
        if(busy || mode !== 'game') return;
        user.push(i);
        if(user[user.length-1] !== seq[user.length-1]) {
            anim(i, true);
            const score = seq.length-1;
            if(score > best) { best = score; localStorage.setItem('echoKeyBest', best); }
            document.getElementById('res').innerText = score;
            document.getElementById('top').innerText = best;
            mode = 'menu';
            setTimeout(() => { 
                document.getElementById('hud-content').style.display = 'none'; 
                document.getElementById('exit-btn').style.display = 'none';
                document.getElementById('end-menu').style.display = 'flex'; 
            }, 800);
        } else {
            if(user.length === seq.length) {
                anim(i, false);
                setTimeout(next, 800);
            } else {
                anim(i, false);
            }
        }
    }
function toggleUIInstructions() {
    const content = document.getElementById('instruction-content');
    const btn = document.getElementById('toggle-instructions');
    const banner = document.getElementById('instruction-banner');
    
    if (content.style.display !== 'none') {
        content.style.display = 'none';
        btn.innerText = '? Instructions';
        banner.style.justifyContent = 'flex-end'; 
    } else {
        content.style.display = 'block';
        btn.innerText = 'Hide';
        banner.style.justifyContent = 'space-between';
    }
}

</script>
</body>
</html>
